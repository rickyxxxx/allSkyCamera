<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Camera Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-between;
            margin: 20px;
        }
        .container {
            display: flex;
            width: 100%;
        }
        .image-container {
            width: 60%;
            padding: 10px;
        }
        .control-panel {
            width: 35%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left: Real-time image display -->
        <div class="image-container">
            <h2>Live Camera Feed</h2>
            <img id="plot" src="" width="100%">
        </div>

        <!-- Right: Control panel -->
        <div class="control-panel">
            <h2>Camera Control</h2>

            <label for="exposure">Exposure Time:</label>
            <input type="number" id="exposure" value="1.0" step="0.1">

            <label for="gain">Gain:</label>
            <input type="number" id="gain" value="1.0" step="0.1">

            <button id="change-setting">Change Setting</button>
            <button id="lock-button">Lock</button>
            <button id="track-button" disabled>Track</button>
        </div>
    </div>

    <script>
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var isLocked = false;
        var isTracking = false;

        // Function to update UI based on server state
        function updateUI(state) {
            document.getElementById('exposure').value = state.exposure_time;
            document.getElementById('gain').value = state.gain;
            var lockButton = document.getElementById('lock-button');
            var trackButton = document.getElementById('track-button');

            if (state.is_locked) {
                lockButton.textContent = 'Reset';
                trackButton.disabled = false;
            } else {
                lockButton.textContent = 'Lock';
                trackButton.textContent = 'Track';
                trackButton.disabled = true;
            }

            if (state.is_tracking) {
                trackButton.textContent = 'Stop';
            } else {
                trackButton.textContent = 'Track';
            }
        }

        // Fetch server state on page load
        window.onload = function() {
            fetch('/get_state')
                .then(response => response.json())
                .then(data => {
                    updateUI(data);
                });
        };

        // Handle settings change
        document.getElementById("change-setting").addEventListener("click", function() {
            alert("Settings changed!");
            let exposure = document.getElementById("exposure").value;
            let gain = document.getElementById("gain").value;
            socket.emit("change_setting", { exposure: exposure, gain: gain });
        });

        // Handle lock/unlock toggle
        document.getElementById("lock-button").addEventListener("click", function() {
            socket.emit("toggle_lock");
        });

        // Handle track/stop toggle
        document.getElementById("track-button").addEventListener("click", function() {
            if (isLocked) {
                socket.emit("toggle_track");
            }
        });

        // Socket event listeners
        socket.on("update_state", function(state) {
            updateUI(state);
        });

        // Update image in real-time
        socket.on('update_plot', function(data) {
            document.getElementById("plot").src = "data:image/png;base64," + data.image;
        });

        socket.on("connect", function() {
            console.log("WebSocket connected!");
        });

        socket.on("disconnect", function() {
            console.error("WebSocket disconnected. Attempting to reconnect...");
            setTimeout(() => location.reload(), 3000);  // Reload page after 3 seconds if disconnected
        });
    </script>
</body>
</html>
