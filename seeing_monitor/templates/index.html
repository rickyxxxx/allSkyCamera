<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Control</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
        }
        #left {
            width: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #right {
            width: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        button {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div id="left">
        <img src="{{ url_for('video_feed') }}">
    </div>
    <div id="right">
        <button onclick="sendControl('preview')">Preview</button>
        <button onclick="sendControl('tracking')">Tracking</button>
        <button onclick="sendControl('exposure')">Exposure Control</button>
        <button onclick="sendControl('export')">Export Data</button>
    </div>

<script>
    function updateImage(newImageArray) {
        fetch('/update_image', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ image: newImageArray }),
        }).then(response => response.text())
          .then(data => console.log(data));
    }
</script>
</body>
</html>
